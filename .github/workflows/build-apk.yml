name: Build single-package APK (ImmortalWrt stable + snapshot)

# ---------------------------------------------------------------------------
# Layout
#   binaries : Rust + Go are built ONCE per arch with their OWN official SDKs
#              (rustup / go toolchain). No OpenWrt SDK is involved here.
#   package  : the OpenWrt SDK only assembles/signs ONE apk per (channel, arch).
#              Build/Compile is empty, so the SDK never builds Rust.
#   release  : one release, four single-package apks.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release after a successful build'
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'luci-app-flclash/**'
      - 'flclash-api/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
      - 'README.md'

permissions:
  contents: write

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Version numbers are NOT hard-coded here: every consumer job derives
  # PKG_VERSION / PKG_RELEASE from luci-app-flclash/Makefile so the workflow,
  # the Cargo crate and the apk can never drift apart.
  PKG_RELEASE: 1
  # Multi-threaded downloader used for the OpenWrt SDK tarballs.
  FLUXDOWN_VERSION: 0.6.8

jobs:
  # -------------------------------------------------------------------------
  # 1) Prebuilt binaries — official toolchains only
  # -------------------------------------------------------------------------
  binaries:
    name: Binaries (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64-a53
            rust_target: aarch64-unknown-linux-musl
            rust_arch: aarch64
            goarch: arm64
            goenv: GOARM64=v8.0
            core_bin: mihomo-arm64
            expect: 'ARM aarch64'
          - platform: x86-64
            rust_target: x86_64-unknown-linux-musl
            rust_arch: x86-64
            goarch: amd64
            goenv: GOAMD64=v1
            core_bin: mihomo-amd64
            expect: 'x86-64'
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/setup-fluxdown
        with:
          version: ${{ env.FLUXDOWN_VERSION }}

      - name: Install host build deps
        run: |
          set -euo pipefail
          pkgs="build-essential clang file binutils curl ca-certificates git zstd gcc-aarch64-linux-gnu g++-aarch64-linux-gnu musl-tools"
          # The runner image ships a working apt index; a blind `apt-get update`
          # against a throttled mirror is what made this step sit for 10+ min.
          if ! sudo apt-get install -y --no-install-recommends $pkgs; then
            echo "install failed, refreshing index once"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends $pkgs
          fi
          musl-gcc --version | head -1
          aarch64-linux-gnu-gcc --version | head -1

      # Rust official SDK: rustup + rust-std for the musl target.
      # NOT the OpenWrt SDK, NOT an OP rust package.
      - name: Rust official toolchain (rustup)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: rustfmt

      - name: Rust tests + static musl build (official SDK)
        working-directory: flclash-api
        env:
          # ring (via reqwest/rustls) compiles C for the musl target, so cc-rs
          # needs a compiler per target: aarch64 uses the Debian cross gcc,
          # x86_64 needs musl-gcc from musl-tools (the host gcc targets glibc
          # and cc-rs would otherwise fail with "x86_64-linux-musl-gcc missing").
          CC_aarch64_unknown_linux_musl: aarch64-linux-gnu-gcc
          AR_aarch64_unknown_linux_musl: aarch64-linux-gnu-ar
          CC_x86_64_unknown_linux_musl: musl-gcc
          AR_x86_64_unknown_linux_musl: ar
          RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          cargo --version
          rustc --version --verbose
          # Fail fast with a clear message if the per-target C compiler is missing.
          case "${RUST_TARGET}" in
            x86_64-unknown-linux-musl)
              command -v musl-gcc >/dev/null || { echo "musl-gcc missing (apt install musl-tools)"; exit 1; } ;;
            aarch64-unknown-linux-musl)
              command -v aarch64-linux-gnu-gcc >/dev/null || { echo "aarch64-linux-gnu-gcc missing"; exit 1; } ;;
          esac
          musl-gcc --version | head -1 || true
          aarch64-linux-gnu-gcc --version | head -1 || true
          cargo test --locked
          cargo build --release --locked --target "${{ matrix.rust_target }}" --bins
          for b in flclash-api flclash-core-bridge; do
            f="target/${{ matrix.rust_target }}/release/$b"
            file "$f"
            file "$f" | grep -q 'ELF' || { echo "$b: not ELF"; exit 1; }
            file "$f" | grep -Eq 'statically linked|static-pie linked' \
              || { echo "$b: not static"; exit 1; }
            file "$f" | grep -q '${{ matrix.expect }}' \
              || { echo "$b: wrong arch"; exit 1; }
          done

      - name: Fetch FlClash core source (FluxDown tarballs)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/FlClash"
          dl="$RUNNER_TEMP/src-dl"
          mkdir -p "$src" "$dl"
          # Host repo: main snapshot, fetched by the same downloader as the SDKs.
          fluxdown add --local -d "$dl" -o flclash.tar.gz -s 16 \
            "https://codeload.github.com/chen08209/FlClash/tar.gz/refs/heads/main"
          tar xzf "$dl/flclash.tar.gz" -C "$src" --strip-components=1
          # Submodule: resolve the gitlink instead of trusting a branch, so the
          # pin stays exactly what `git submodule update` would have checked out.
          meta_sha=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/chen08209/FlClash/contents/core/Clash.Meta" | jq -r .sha)
          test -n "$meta_sha" -a "$meta_sha" != "null" || { echo "cannot resolve core/Clash.Meta pin"; exit 1; }
          echo "core/Clash.Meta @ $meta_sha"
          fluxdown add --local -d "$dl" -o meta.tar.gz -s 16 \
            "https://codeload.github.com/chen08209/Clash.Meta/tar.gz/$meta_sha"
          mkdir -p "$src/core/Clash.Meta"
          tar xzf "$dl/meta.tar.gz" -C "$src/core/Clash.Meta" --strip-components=1
          test -f "$src/core/go.mod"
          test -f "$src/core/Clash.Meta/go.mod"
          echo "FLCLASH_CORE=$src/core" >> "$GITHUB_ENV"

      - name: Go official toolchain (FluxDown)
        env:
          GO_SERIES: '1.27'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/godl"
          # One downloader for everything: the index is small, but keeping all
          # fetches on FluxDown means a single place decides retries/segments.
          fluxdown add --local -d "$RUNNER_TEMP/godl" -o go-index.json -s 4 \
            "https://go.dev/dl/?mode=json&include=all"
          index="$RUNNER_TEMP/godl/go-index.json"
          file=$(jq -r --arg s "$GO_SERIES" \
            '[ .[] | select(.stable) | select(.version | startswith("go" + $s + ".")) ]
             | sort_by(.version | ltrimstr("go") | split(".") | map(tonumber))
             | last
             | .files[] | select(.os == "linux" and .arch == "amd64" and .kind == "archive")
             | .filename' "$index")
          test -n "${file:-}" -a "$file" != "null" || { echo "no Go $GO_SERIES linux-amd64 tarball"; exit 1; }
          sha=$(jq -r --arg f "$file" '[ .[] | .files[] | select(.filename == $f) ] | first | .sha256' "$index")
          echo "Go: $file ($sha)"
          fluxdown add --local -d "$RUNNER_TEMP/godl" -o "$file" -s 16 \
            --checksum "sha256=$sha" "https://go.dev/dl/$file"
          tar -xzf "$RUNNER_TEMP/godl/$file" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/go/bin" >> "$GITHUB_PATH"
          echo "GOROOT=$RUNNER_TEMP/go" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/go/bin/go" version

      - name: Build static IPC core (official Go toolchain)
        run: |
          set -euo pipefail
          mkdir -p luci-app-flclash/files/usr/bin
          cd "$FLCLASH_CORE"
          env CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} ${{ matrix.goenv }} \
              GOTOOLCHAIN=local go build -tags with_gvisor -ldflags "-w -s" \
              -o "$GITHUB_WORKSPACE/luci-app-flclash/files/usr/bin/${{ matrix.core_bin }}" ./cmd/core
          f="$GITHUB_WORKSPACE/luci-app-flclash/files/usr/bin/${{ matrix.core_bin }}"
          file "$f"
          file "$f" | grep -q 'statically linked' || { echo "core not static"; exit 1; }

      - name: Stage Rust binaries into the single package
        run: |
          set -euo pipefail
          cp "flclash-api/target/${{ matrix.rust_target }}/release/flclash-api" \
             luci-app-flclash/files/usr/bin/flclash-api
          cp "flclash-api/target/${{ matrix.rust_target }}/release/flclash-core-bridge" \
             luci-app-flclash/files/usr/bin/flclash-core-bridge
          # Normalize the core name: the package always ships /usr/bin/mihomo.
          mv "luci-app-flclash/files/usr/bin/${{ matrix.core_bin }}" \
             luci-app-flclash/files/usr/bin/mihomo
          chmod 0755 luci-app-flclash/files/usr/bin/*
          ls -lh luci-app-flclash/files/usr/bin/
          sha256sum luci-app-flclash/files/usr/bin/*

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: bins-${{ matrix.platform }}
          path: luci-app-flclash/files/usr/bin/*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 2) Single apk per (channel, arch) — SDK only assembles, never builds Rust
  # -------------------------------------------------------------------------
  package:
    name: APK ${{ matrix.channel }} / ${{ matrix.arch }}
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: immortalwrt-25.12.2
            sdk_base: https://downloads.immortalwrt.org/releases/25.12.2/targets/mediatek/filogic
            sdk_glob: 'immortalwrt-sdk-25.12.2-mediatek-filogic_gcc-.*\.Linux-x86_64\.tar\.zst'
            subtarget: mediatek/filogic
            arch: aarch64_cortex-a53
            platform: arm64-a53
            expect_file: 'ARM aarch64'
          - channel: immortalwrt-25.12.2
            sdk_base: https://downloads.immortalwrt.org/releases/25.12.2/targets/x86/64
            sdk_glob: 'immortalwrt-sdk-25.12.2-x86-64_gcc-.*\.Linux-x86_64\.tar\.zst'
            subtarget: x86/64
            arch: x86_64
            platform: x86-64
            expect_file: 'x86-64'
          - channel: immortalwrt-snapshot
            sdk_base: https://downloads.immortalwrt.org/snapshots/targets/mediatek/filogic
            sdk_glob: 'immortalwrt-sdk-mediatek-filogic_gcc-.*\.Linux-x86_64\.tar\.zst'
            subtarget: mediatek/filogic
            arch: aarch64_cortex-a53
            platform: arm64-a53
            expect_file: 'ARM aarch64'
          - channel: immortalwrt-snapshot
            sdk_base: https://downloads.immortalwrt.org/snapshots/targets/x86/64
            sdk_glob: 'immortalwrt-sdk-x86-64_gcc-.*\.Linux-x86_64\.tar\.zst'
            subtarget: x86/64
            arch: x86_64
            platform: x86-64
            expect_file: 'x86-64'
    steps:
      - uses: actions/checkout@v5

      # The ubuntu-24.04 runner already ships make/gcc/perl/rsync/unzip/zstd.
      # Do NOT run apt-get update here: it made ARM jobs sit for 15+ min on a
      # throttled mirror while x86 jobs finished in 90s.
      - name: Check preinstalled packaging tools
        run: |
          set -euo pipefail
          for t in make gcc g++ perl rsync unzip zstd tar file curl git; do
            command -v "$t" >/dev/null || { echo "missing host tool: $t"; exit 1; }
          done
          make --version | head -1
          gcc --version | head -1
          zstd --version

      - uses: ./.github/actions/setup-fluxdown
        with:
          version: ${{ env.FLUXDOWN_VERSION }}

      - name: Resolve package version from Makefile
        run: |
          set -euo pipefail
          v=$(sed -n 's/^PKG_VERSION:=//p' luci-app-flclash/Makefile | tr -d '[:space:]')
          r=$(sed -n 's/^PKG_RELEASE:=//p' luci-app-flclash/Makefile | tr -d '[:space:]')
          test -n "$v" || { echo "PKG_VERSION missing in luci-app-flclash/Makefile"; exit 1; }
          test -n "$r" || r=1
          # The Cargo crate must carry the same version, otherwise --locked
          # builds and the apk disagree about what is being shipped.
          cv=$(sed -n 's/^version = "\(.*\)"/\1/p' flclash-api/Cargo.toml | head -1)
          test "$cv" = "$v" || { echo "version drift: Makefile=$v Cargo.toml=$cv"; exit 1; }
          echo "PKG_VERSION=$v" >> "$GITHUB_ENV"
          echo "PKG_RELEASE=$r" >> "$GITHUB_ENV"
          echo "package: luci-app-flclash $v-r$r"

      - name: Cache OpenWrt SDK (${{ matrix.channel }} / ${{ matrix.arch }})
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/sdk-cache
          key: sdk-${{ matrix.channel }}-${{ matrix.arch }}-v3

      - name: Download ${{ matrix.channel }} SDK (${{ matrix.subtarget }}) — FluxDown, 16 segments
        env:
          SDK_BASE: ${{ matrix.sdk_base }}
          SDK_GLOB: ${{ matrix.sdk_glob }}
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/sdk-cache"
          mkdir -p "$sdk_dir"

          # sha256sums is authoritative for BOTH the filename and the digest.
          # Parsing the HTML index first is fragile: rewritten/absolute hrefs,
          # '*file' and './file' checksum forms all used to poison the URL or
          # the --checksum value handed to FluxDown.
          sums=$(curl -fsSL --retry 5 --retry-all-errors --max-time 120 "$SDK_BASE/sha256sums" || true)
          file=$(printf '%s\n' "$sums" \
                 | awk '{ n=$2; sub(/^\*/,"",n); sub(/^.*\//,"",n);
                          if (n ~ ENVIRON["SDK_GLOB"]) { print n; exit } }' || true)
          if [ -z "$file" ]; then
            listing=$(curl -fsSL --retry 5 --retry-all-errors --max-time 120 "$SDK_BASE/" || true)
            file=$(printf '%s\n' "$listing" \
                   | grep -oE 'href="[^"]+\.tar\.zst"' | sed -e 's/href="//' -e 's/"$//' \
                   | sed -e 's#^\./##' -e 's#^.*/##' \
                   | grep -E "$SDK_GLOB" | sort -u | head -n1 || true)
          fi
          test -n "$file" || { echo "SDK not found at $SDK_BASE"; exit 1; }
          url="$SDK_BASE/$file"
          echo "Using SDK: $file"

          hash=$(printf '%s\n' "$sums" \
                 | awk -v f="$file" '{ n=$2; sub(/^\*/,"",n); sub(/^.*\//,"",n);
                                      if (n==f) { print $1; exit } }' || true)
          verify() {
            if [ -n "$hash" ]; then
              echo "$hash  $sdk_dir/$file" | sha256sum -c -
            else
              echo "warning: no sha256 for $file in sha256sums; size check only"
            fi
          }

          want=$(curl -sIL --retry 3 --max-time 60 "$url" \
                 | tr -d '\r' \
                 | awk 'tolower($1)=="content-length:" && $2+0>1024 {v=$2} END{print v}' || true)

          # A cached tarball is trusted only when size AND digest match.
          if [ -s "$sdk_dir/$file" ] \
             && { [ -z "$want" ] || [ "$(stat -c%s "$sdk_dir/$file")" = "$want" ]; } \
             && verify >/dev/null 2>&1; then
            echo "cache hit: $(du -h "$sdk_dir/$file" | cut -f1)"
          else
            rm -f "$sdk_dir/$file"
            # FluxDown stays the only downloader. Use 16 segments only when the
            # mirror honours Range; mirrors that ignore it get one connection.
            seg=16
            rc=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 -r 0-0 "$url" || true)
            case "$rc" in
              206|416) ;;
              *) seg=1 ;;
            esac
            echo "FluxDown: $seg segment(s)"
            fd=(--local -d "$sdk_dir" -o "$file" -s "$seg")
            if [ -n "$hash" ]; then fd+=(--checksum "sha256=$hash"); fi
            if ! fluxdown add "${fd[@]}" "$url"; then
              echo "FluxDown $seg-segment download failed; retrying with 1 segment"
              rm -f "$sdk_dir/$file"
              fd=(--local -d "$sdk_dir" -o "$file.retry" -s 1)
              if [ -n "$hash" ]; then fd+=(--checksum "sha256=$hash"); fi
              fluxdown add "${fd[@]}" "$url"
              mv "$sdk_dir/$file.retry" "$sdk_dir/$file"
            fi
          fi

          got=$(stat -c%s "$sdk_dir/$file")
          if [ -n "$want" ]; then
            [ "$got" = "$want" ] || { echo "SDK size mismatch: $got != $want"; exit 1; }
          fi
          verify
          du -h "$sdk_dir/$file"

          mkdir -p sdk
          tar --zstd -xf "$sdk_dir/$file" -C sdk --strip-components=1
          test -f sdk/rules.mk

      - name: Fetch prebuilt binaries (no compilation here)
        uses: actions/download-artifact@v6
        with:
          name: bins-${{ matrix.platform }}
          path: luci-app-flclash/files/usr/bin

      - name: Verify binaries and arch gate
        run: |
          set -euo pipefail
          ls -lh luci-app-flclash/files/usr/bin/
          for b in mihomo flclash-api flclash-core-bridge; do
            f="luci-app-flclash/files/usr/bin/$b"
            test -f "$f" || { echo "missing $b"; exit 1; }
            chmod 0755 "$f"
            file "$f" | grep -q 'ELF' || { echo "$b not ELF"; exit 1; }
            file "$f" | grep -q '${{ matrix.expect_file }}' \
              || { echo "$b arch mismatch (expected ${{ matrix.expect_file }})"; exit 1; }
            if readelf -l "$f" 2>/dev/null | grep -q INTERP; then
              echo "$b has an interpreter (not static)"; exit 1
            fi
          done
          echo "arch gate OK for ${{ matrix.arch }}"

      - name: Stage the single package into the SDK
        run: |
          set -euo pipefail
          rm -rf sdk/package/luci-app-flclash
          mkdir -p sdk/package
          cp -a luci-app-flclash sdk/package/luci-app-flclash
          # Belt and braces: the OP SDK must never see Rust sources.
          rm -rf sdk/package/luci-app-flclash/flclash-api
          test -x sdk/package/luci-app-flclash/files/usr/bin/mihomo
          test -x sdk/package/luci-app-flclash/files/usr/bin/flclash-api
          test -x sdk/package/luci-app-flclash/files/usr/bin/flclash-core-bridge

      - name: Build the apk (SDK assemble only)
        run: |
          set -euo pipefail
          cd sdk
          make defconfig
          make -j"$(nproc)" package/luci-app-flclash/compile V=s
          echo "=== apk candidates ==="
          find bin -type f -name 'luci-app-flclash*.apk' -print

      - name: Collect + validate exactly one apk
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find sdk/bin -type f -name 'luci-app-flclash*.apk' | sort)
          echo "found ${#apks[@]} apk(s)"
          [ "${#apks[@]}" -eq 1 ] || { printf '%s\n' "${apks[@]}"; echo "expected exactly ONE apk"; exit 1; }
          src="${apks[0]}"
          out="dist/luci-app-flclash_${PKG_VERSION}-r${PKG_RELEASE}_${{ matrix.arch }}_${{ matrix.channel }}.apk"
          cp "$src" "$out"
          echo "== apk metadata =="
          ls -lh "$out"
          file "$out"
          echo "== control section =="
          tar -tzvf "$out" || true
          echo "== payload sample =="
          tar -xzOf "$out" ./usr/bin/mihomo 2>/dev/null | head -c 4 | od -An -tx1 || true
          sha256sum "$out" | tee "$out.sha256"
          echo "SINGLE_APK=$out" >> "$GITHUB_ENV"

      - name: Upload the single apk
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ matrix.channel }}-${{ matrix.arch }}
          path: dist/*.apk
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 3) One release with exactly four assets
  # -------------------------------------------------------------------------
  release:
    name: Release (single-package apk)
    needs: package
    if: |
      needs.package.result == 'success' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v') ||
       (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Download all apk artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: apk-*
          path: release
          merge-multiple: true

      - name: Resolve package version from Makefile
        run: |
          set -euo pipefail
          v=$(sed -n 's/^PKG_VERSION:=//p' luci-app-flclash/Makefile | tr -d '[:space:]')
          r=$(sed -n 's/^PKG_RELEASE:=//p' luci-app-flclash/Makefile | tr -d '[:space:]')
          test -n "$v" || { echo "PKG_VERSION missing in luci-app-flclash/Makefile"; exit 1; }
          test -n "$r" || r=1
          # The Cargo crate must carry the same version, otherwise --locked
          # builds and the apk disagree about what is being shipped.
          cv=$(sed -n 's/^version = "\(.*\)"/\1/p' flclash-api/Cargo.toml | head -1)
          test "$cv" = "$v" || { echo "version drift: Makefile=$v Cargo.toml=$cv"; exit 1; }
          echo "PKG_VERSION=$v" >> "$GITHUB_ENV"
          echo "PKG_RELEASE=$r" >> "$GITHUB_ENV"
          echo "package: luci-app-flclash $v-r$r"

      - name: Inventory
        run: |
          set -euo pipefail
          ls -lh release
          n=$(find release -name '*.apk' | wc -l)
          test "$n" -eq 4 || { echo "expected 4 apks, got $n"; exit 1; }
          ( cd release && sha256sum *.apk > sha256sums.txt )
          cat release/sha256sums.txt

      - name: Drop stale assets for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="v${PKG_VERSION}"
          API="https://api.github.com/repos/${{ github.repository }}"
          code=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "$API/releases/tags/$TAG") || code=000
          if [ "$code" = "404" ]; then
            echo "no release for $TAG yet (404) - nothing to prune"
            exit 0
          fi
          if [ "$code" != "200" ]; then
            echo "unexpected HTTP $code for $TAG"; cat "$RUNNER_TEMP/release.json"; exit 1
          fi
          rid=$(jq -r .id "$RUNNER_TEMP/release.json")
          echo "release $TAG -> id $rid; pruning old assets"
          ids=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" "$API/releases/$rid/assets?per_page=100" | jq -r '.[].id')
          for aid in $ids; do
            echo "  delete asset $aid"
            curl -sS -X DELETE -H "Authorization: Bearer $GH_TOKEN" "$API/releases/assets/$aid" >/dev/null || true
          done
          echo done

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.PKG_VERSION }}
          name: FlClash v${{ env.PKG_VERSION }} — ImmortalWrt single-package APK
          body: |
            Single-package **luci-app-flclash** (Go core + Rust bridge + LuCI + WebUI in ONE apk).

            Build: `${{ github.sha }}` · workflow run [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · ${{ github.ref_name }}

            | File | Arch | Target SDK |
            | --- | --- | --- |
