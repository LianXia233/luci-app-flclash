name: Build FlClash OpenWrt apk (aarch64_cortex-a53)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

env:
  GO_VERSION: '1.27.3'
  TARGET_SUBTARGET: armsr/armv8
  SDK_DIR: sdk
  RELEASE_TAG: apk-aarch64-cortex-a53

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses-dev libssl-dev python3 \
            rsync unzip zlib1g-dev file wget curl zstd xz-utils

      - name: Setup Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Fetch FlClash source and core submodule
        run: |
          git clone --depth 1 https://github.com/chen08209/FlClash.git "$RUNNER_TEMP/FlClash"
          cd "$RUNNER_TEMP/FlClash"
          git -c url.https://github.com/.insteadOf=git@github.com: \
            submodule update --init --depth 1 core/Clash.Meta
          echo "FLCLASH_SRC=$RUNNER_TEMP/FlClash/core/Clash.Meta" >> "$GITHUB_ENV"

      - name: Build static mihomo core (linux/arm64, cortex-a53)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/flclash-core/files/usr/bin"
          cd "$FLCLASH_SRC"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 GOARM64=v8.0 \
            go build -tags with_gvisor -ldflags "-w -s" \
              -o "$GITHUB_WORKSPACE/flclash-core/files/usr/bin/mihomo-arm64" .
          file "$GITHUB_WORKSPACE/flclash-core/files/usr/bin/mihomo-arm64"

      - name: Download OpenWrt SNAPSHOT SDK (${{ env.TARGET_SUBTARGET }})
        run: |
          BASE="https://downloads.openwrt.org/snapshots/targets/${TARGET_SUBTARGET}"
          SDK_FILE=$(curl -fsSL "$BASE/" \
            | grep -oE 'openwrt-sdk-[^"<> ]+\.tar\.zst' | sort -u | head -n1)
          test -n "$SDK_FILE" || { echo "SDK not found at $BASE"; exit 1; }
          echo "Using SDK: $SDK_FILE"
          curl -fsSL "$BASE/$SDK_FILE" -o "$RUNNER_TEMP/sdk.tar.zst"
          mkdir -p "$SDK_DIR"
          tar --zstd -xf "$RUNNER_TEMP/sdk.tar.zst" -C "$SDK_DIR" --strip-components=1

      - name: Stage packages into SDK
        run: |
          mkdir -p "$SDK_DIR/package/flclash-core" \
                   "$SDK_DIR/package/luci-app-flclash-webui"
          cp -a "$GITHUB_WORKSPACE/flclash-core/." "$SDK_DIR/package/flclash-core/"
          cp -a "$GITHUB_WORKSPACE/luci-app-flclash-webui/." "$SDK_DIR/package/luci-app-flclash-webui/"

      - name: Build apk packages
        run: |
          cd "$SDK_DIR"
          make defconfig
          make -j"$(nproc)" package/flclash-core/compile
          make -j"$(nproc)" package/luci-app-flclash-webui/compile
          echo "=== built apk ==="
          find bin -type f -name '*.apk' -print

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          find "$SDK_DIR/bin" -type f -name '*.apk' \
            -exec cp -v {} "$GITHUB_WORKSPACE/artifacts/" \;
          ls -lh "$GITHUB_WORKSPACE/artifacts"
          test -n "$(find "$GITHUB_WORKSPACE/artifacts" -name '*.apk' -print -quit)" \
            || { echo "No apk produced"; exit 1; }

      - name: Upload apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: flclash-apk-aarch64-cortex-a53
          path: artifacts/*.apk
          if-no-files-found: error

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: FlClash OpenWrt apk - aarch64_cortex-a53
          body: |
            FlClash WebUI + static mihomo core for OpenWrt master / SNAPSHOT (aarch64_cortex-a53).

            Built from source in GitHub Actions: Go ${{ env.GO_VERSION }} static core (CGO_ENABLED=0, with_gvisor) + OpenWrt SNAPSHOT SDK (${{ env.TARGET_SUBTARGET }}).

            Packages:
            - flclash-core: static mihomo core, installed as /usr/bin/mihomo
            - luci-app-flclash-webui: LuCI launcher + HTML5 WebUI
          files: artifacts/*.apk
          generate_release_notes: false
          fail_on_unmatched_files: false
