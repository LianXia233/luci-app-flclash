name: Build single-package APK (ImmortalWrt stable + snapshot)

# ---------------------------------------------------------------------------
# Layout
#   binaries : Rust + Go are built ONCE per arch with their OWN official SDKs
#              (rustup / go toolchain). No OpenWrt SDK is involved here.
#   package  : the OpenWrt SDK only assembles/signs ONE apk per (channel, arch).
#              Build/Compile is empty, so the SDK never builds Rust.
#   release  : one release, four single-package apks.
# ---------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the release after a successful build'
        type: boolean
        default: true
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'luci-app-flclash/**'
      - 'flclash-api/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
      - 'README.md'

permissions:
  contents: write

env:
  PKG_VERSION: 1.2.0
  PKG_RELEASE: 1

jobs:
  # -------------------------------------------------------------------------
  # 1) Prebuilt binaries — official toolchains only
  # -------------------------------------------------------------------------
  binaries:
    name: Binaries (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: arm64-a53
            rust_target: aarch64-unknown-linux-musl
            rust_arch: aarch64
            goarch: arm64
            goenv: GOARM64=v8.0
            core_bin: mihomo-arm64
            expect: 'ARM aarch64'
          - platform: x86-64
            rust_target: x86_64-unknown-linux-musl
            rust_arch: x86-64
            goarch: amd64
            goenv: GOAMD64=v1
            core_bin: mihomo-amd64
            expect: 'x86-64'
    steps:
      - uses: actions/checkout@v5

      - name: Install host build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang file binutils curl ca-certificates git zstd

      # Rust official SDK: rustup + rust-std for the musl target.
      # NOT the OpenWrt SDK, NOT an OP rust package.
      - name: Rust official toolchain (rustup)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
          components: rustfmt

      - name: Rust tests + static musl build (official SDK)
        working-directory: flclash-api
        run: |
          set -euo pipefail
          cargo --version
          rustc --version --verbose
          cargo test --locked
          cargo build --release --locked --target "${{ matrix.rust_target }}" --bins
          for b in flclash-api flclash-core-bridge; do
            f="target/${{ matrix.rust_target }}/release/$b"
            file "$f"
            file "$f" | grep -q 'ELF' || { echo "$b: not ELF"; exit 1; }
            file "$f" | grep -Eq 'statically linked|static-pie linked' \
              || { echo "$b: not static"; exit 1; }
            file "$f" | grep -q '${{ matrix.expect }}' \
              || { echo "$b: wrong arch"; exit 1; }
          done

      - name: Fetch FlClash core source
        run: |
          git clone --depth 1 https://github.com/chen08209/FlClash.git "$RUNNER_TEMP/FlClash"
          cd "$RUNNER_TEMP/FlClash"
          git -c url.https://github.com/.insteadOf=git@github.com: \
            submodule update --init --depth 1 core/Clash.Meta
          echo "FLCLASH_CORE=$RUNNER_TEMP/FlClash/core" >> "$GITHUB_ENV"

      - name: Go official toolchain
        uses: actions/setup-go@v6
        with:
          go-version: '1.27'
          cache: false

      - name: Build static IPC core (official Go toolchain)
        run: |
          set -euo pipefail
          mkdir -p luci-app-flclash/files/usr/bin
          cd "$FLCLASH_CORE"
          env CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} ${{ matrix.goenv }} \
              GOTOOLCHAIN=local go build -tags with_gvisor -ldflags "-w -s" \
              -o "$GITHUB_WORKSPACE/luci-app-flclash/files/usr/bin/${{ matrix.core_bin }}" ./cmd/core
          f="$GITHUB_WORKSPACE/luci-app-flclash/files/usr/bin/${{ matrix.core_bin }}"
          file "$f"
          file "$f" | grep -q 'statically linked' || { echo "core not static"; exit 1; }

      - name: Stage Rust binaries into the single package
        run: |
          set -euo pipefail
          cp "flclash-api/target/${{ matrix.rust_target }}/release/flclash-api" \
             luci-app-flclash/files/usr/bin/flclash-api
          cp "flclash-api/target/${{ matrix.rust_target }}/release/flclash-core-bridge" \
             luci-app-flclash/files/usr/bin/flclash-core-bridge
          # Normalize the core name: the package always ships /usr/bin/mihomo.
          mv "luci-app-flclash/files/usr/bin/${{ matrix.core_bin }}" \
             luci-app-flclash/files/usr/bin/mihomo
          chmod 0755 luci-app-flclash/files/usr/bin/*
          ls -lh luci-app-flclash/files/usr/bin/
          sha256sum luci-app-flclash/files/usr/bin/*

      - name: Upload binaries
        uses: actions/upload-artifact@v6
        with:
          name: bins-${{ matrix.platform }}
          path: luci-app-flclash/files/usr/bin/*
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 2) Single apk per (channel, arch) — SDK only assembles, never builds Rust
  # -------------------------------------------------------------------------
  package:
    name: APK ${{ matrix.channel }} / ${{ matrix.arch }}
    needs: binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - channel: immortalwrt-25.12.2
            sdk_base: https://downloads.immortalwrt.org/releases/25.12.2/targets/mediatek/filogic
            sdk_glob: 'immortalwrt-sdk-25.12.2-mediatek-filogic_gcc-.*\.Linux-x86_64\.tar\.zst'
            subtarget: mediatek/filogic
            arch: aarch64_cortex-a53
            platform: arm64-a53
            expect_file: 'ARM aarch64'
          - channel: immortalwrt-25.12.2
            sdk_base: https://downloads.immortalwrt.org/releases/25.12.2/targets/x86/64
            sdk_glob: 'immortalwrt-sdk-25.12.2-x86-64_gcc-.*\.Linux-x86_64\.tar\.zst'
            subtarget: x86/64
            arch: x86_64
            platform: x86-64
            expect_file: 'x86-64'
          - channel: immortalwrt-snapshot
            sdk_base: https://downloads.immortalwrt.org/snapshots/targets/mediatek/filogic
            sdk_glob: 'immortalwrt-sdk-mediatek-filogic_gcc-.*\.Linux-x86_64\.tar\.zst'
            subtarget: mediatek/filogic
            arch: aarch64_cortex-a53
            platform: arm64-a53
            expect_file: 'ARM aarch64'
          - channel: immortalwrt-snapshot
            sdk_base: https://downloads.immortalwrt.org/snapshots/targets/x86/64
            sdk_glob: 'immortalwrt-sdk-x86-64_gcc-.*\.Linux-x86_64\.tar\.zst'
            subtarget: x86/64
            arch: x86_64
            platform: x86-64
            expect_file: 'x86-64'
    steps:
      - uses: actions/checkout@v5

      # The ubuntu-24.04 runner already ships make/gcc/perl/rsync/unzip/zstd.
      # Do NOT run apt-get update here: it made ARM jobs sit for 15+ min on a
      # throttled mirror while x86 jobs finished in 90s.
      - name: Check preinstalled packaging tools
        run: |
          set -euo pipefail
          for t in make gcc g++ perl rsync unzip zstd tar file curl git; do
            command -v "$t" >/dev/null || { echo "missing host tool: $t"; exit 1; }
          done
          make --version | head -1
          gcc --version | head -1
          zstd --version

      - name: Download ${{ matrix.channel }} SDK (${{ matrix.subtarget }})
        run: |
          set -euo pipefail
          BASE="${{ matrix.sdk_base }}"
          echo "SDK base: $BASE"
          file=""
          for attempt in 1 2 3 4 5; do
            listing=$(curl -fsSL --retry 5 --retry-all-errors --max-time 120 "$BASE/" || true)
            file=$(printf '%s\n' "$listing" \
                   | grep -oE 'href="[^"]+\.tar\.zst"' | sed -e 's/href="//' -e 's/"$//' \
                   | grep -E '${{ matrix.sdk_glob }}' | sort -u | head -n1 || true)
            [ -n "$file" ] && break
            echo "listing attempt $attempt failed, retrying..."
            sleep 10
          done
          test -n "$file" || { echo "SDK not found at $BASE"; exit 1; }
          echo "Using SDK: $file"
          curl -fSL --retry 5 --retry-all-errors --max-time 900 "$BASE/$file" -o "$RUNNER_TEMP/sdk.tar.zst"
          du -h "$RUNNER_TEMP/sdk.tar.zst"
          mkdir -p sdk
          tar --zstd -xf "$RUNNER_TEMP/sdk.tar.zst" -C sdk --strip-components=1
          test -f sdk/rules.mk

      - name: Fetch prebuilt binaries (no compilation here)
        uses: actions/download-artifact@v6
        with:
          name: bins-${{ matrix.platform }}
          path: luci-app-flclash/files/usr/bin

      - name: Verify binaries and arch gate
        run: |
          set -euo pipefail
          ls -lh luci-app-flclash/files/usr/bin/
          for b in mihomo flclash-api flclash-core-bridge; do
            f="luci-app-flclash/files/usr/bin/$b"
            test -f "$f" || { echo "missing $b"; exit 1; }
            chmod 0755 "$f"
            file "$f" | grep -q 'ELF' || { echo "$b not ELF"; exit 1; }
            file "$f" | grep -q '${{ matrix.expect_file }}' \
              || { echo "$b arch mismatch (expected ${{ matrix.expect_file }})"; exit 1; }
            if readelf -l "$f" 2>/dev/null | grep -q INTERP; then
              echo "$b has an interpreter (not static)"; exit 1
            fi
          done
          echo "arch gate OK for ${{ matrix.arch }}"

      - name: Stage the single package into the SDK
        run: |
          set -euo pipefail
          rm -rf sdk/package/luci-app-flclash
          mkdir -p sdk/package
          cp -a luci-app-flclash sdk/package/luci-app-flclash
          # Belt and braces: the OP SDK must never see Rust sources.
          rm -rf sdk/package/luci-app-flclash/flclash-api
          test -x sdk/package/luci-app-flclash/files/usr/bin/mihomo
          test -x sdk/package/luci-app-flclash/files/usr/bin/flclash-api
          test -x sdk/package/luci-app-flclash/files/usr/bin/flclash-core-bridge

      - name: Build the apk (SDK assemble only)
        run: |
          set -euo pipefail
          cd sdk
          make defconfig
          make -j"$(nproc)" package/luci-app-flclash/compile V=s
          echo "=== apk candidates ==="
          find bin -type f -name 'luci-app-flclash*.apk' -print

      - name: Collect + validate exactly one apk
        run: |
          set -euo pipefail
          mkdir -p dist
          mapfile -t apks < <(find sdk/bin -type f -name 'luci-app-flclash*.apk' | sort)
          echo "found ${#apks[@]} apk(s)"
          [ "${#apks[@]}" -eq 1 ] || { printf '%s\n' "${apks[@]}"; echo "expected exactly ONE apk"; exit 1; }
          src="${apks[0]}"
          out="dist/luci-app-flclash_${PKG_VERSION}-r${PKG_RELEASE}_${{ matrix.arch }}_${{ matrix.channel }}.apk"
          cp "$src" "$out"
          echo "== apk metadata =="
          ls -lh "$out"
          file "$out"
          echo "== control section =="
          tar -tzvf "$out" || true
          echo "== payload sample =="
          tar -xzOf "$out" ./usr/bin/mihomo 2>/dev/null | head -c 4 | od -An -tx1 || true
          sha256sum "$out" | tee "$out.sha256"
          echo "SINGLE_APK=$out" >> "$GITHUB_ENV"

      - name: Upload the single apk
        uses: actions/upload-artifact@v6
        with:
          name: apk-${{ matrix.channel }}-${{ matrix.arch }}
          path: dist/*.apk
          if-no-files-found: error

  # -------------------------------------------------------------------------
  # 3) One release with exactly four assets
  # -------------------------------------------------------------------------
  release:
    name: Release (single-package apk)
    needs: package
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish == true)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Download all apk artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: apk-*
          path: release
          merge-multiple: true

      - name: Inventory
        run: |
          set -euo pipefail
          ls -lh release
          n=$(find release -name '*.apk' | wc -l)
          test "$n" -eq 4 || { echo "expected 4 apks, got $n"; exit 1; }
          ( cd release && sha256sum *.apk > sha256sums.txt )
          cat release/sha256sums.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.PKG_VERSION }}
          name: FlClash v${{ env.PKG_VERSION }} — ImmortalWrt single-package APK
          body: |
            Single-package **luci-app-flclash** (Go core + Rust bridge + LuCI + WebUI in ONE apk).

            | File | Arch | Target SDK |
            | --- | --- | --- |
            | `luci-app-flclash_${{ env.PKG_VERSION }}-r${{ env.PKG_RELEASE }}_aarch64_cortex-a53_immortalwrt-25.12.2.apk` | ARM64-A53 | ImmortalWrt 25.12.2 (mediatek/filogic) |
            | `luci-app-flclash_${{ env.PKG_VERSION }}-r${{ env.PKG_RELEASE }}_x86_64_immortalwrt-25.12.2.apk` | x86_64 | ImmortalWrt 25.12.2 (x86/64) |
            | `luci-app-flclash_${{ env.PKG_VERSION }}-r${{ env.PKG_RELEASE }}_aarch64_cortex-a53_immortalwrt-snapshot.apk` | ARM64-A53 | ImmortalWrt snapshot (mediatek/filogic) |
            | `luci-app-flclash_${{ env.PKG_VERSION }}-r${{ env.PKG_RELEASE }}_x86_64_immortalwrt-snapshot.apk` | x86_64 | ImmortalWrt snapshot (x86/64) |

            Install:
            ```sh
            apk add --allow-untrusted ./luci-app-flclash_*.apk
            ```

            Build facts:
            - Rust (`flclash-api`, `flclash-core-bridge`) compiled by the **official Rust SDK** (rustup + rust-std musl), static, rust-lld; the OpenWrt SDK only assembles the package.
            - Go core (`mihomo`, FlClash native-IPC) compiled by the official Go toolchain: ARM64 `GOARM64=v8.0`, x86_64 `GOAMD64=v1`, CGO disabled, `with_gvisor`.
            - 4 assets total; every other package stays untouched in the SDK.
          files: |
            release/*.apk
            release/sha256sums.txt
          fail_on_unmatched_files: true
