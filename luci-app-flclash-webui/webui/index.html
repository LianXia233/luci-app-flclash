<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7">
  <meta name="flclash-api-base" content="/flclash/api">
  <title>FlClash</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/views.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m8.4 13.8 2.4 2.3 4.8-5.1"/></svg>
        </span>
        <span class="brand-text">FlClash</span>
      </div>
      <nav class="side-nav" id="side-nav" aria-label="主导航"></nav>
      <div class="side-foot">
        <div class="side-status" id="side-status">
          <span class="dot"></span><span id="side-status-text">正在连接</span>
        </div>
        <div class="side-version" id="side-version">WebUI</div>
      </div>
    </aside>

    <main class="main">
      <header class="app-header">
        <div class="header-copy">
          <h1 id="page-title">仪表盘</h1>
          <p class="header-sub" id="page-sub"></p>
        </div>
        <div class="header-actions">
          <div class="header-traffic" id="header-traffic" aria-hidden="true">
            <span class="traffic-up"><i></i><b>0 B/s</b></span>
            <span class="traffic-down"><i></i><b>0 B/s</b></span>
          </div>
          <button class="round-action is-ok" id="core-status" type="button" aria-label="核心状态" title="核心状态"></button>
          <button class="round-action" id="theme-toggle" type="button" aria-label="切换主题" title="切换主题"></button>
        </div>
      </header>
      <section class="view-root" id="view-root" aria-live="polite"></section>
    </main>
  </div>

  <nav class="bottom-nav" id="bottom-nav" aria-label="移动导航"></nav>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="sheet-title">
    <header class="sheet-head">
      <div class="sheet-handle" aria-hidden="true"></div>
      <h2 class="sheet-title" id="sheet-title"></h2>
      <button class="icon-button" id="sheet-close" type="button" aria-label="关闭"></button>
    </header>
    <div class="sheet-body" id="sheet-body"></div>
  </section>

  <div class="toast-stack" id="toast-stack" aria-live="polite"></div>
  <div class="boot-splash" id="boot-splash"><span class="spinner"></span></div>

  <script src="js/config.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/mock.js"></script>
  <script src="js/api.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
